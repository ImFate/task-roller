<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background:#ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.taskHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.pointsBadge{
  font-size:18px;
  font-weight:900;
  padding:6px 12px;
  border-radius:999px;
  background:#ffff00;
  color:#111;
}

.tag{
  font-size:12px;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,122,24,.2);
  font-weight:800;
}

.desc{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-weight:700;
}

textarea{
  width:100%;
  background:rgba(0,0,0,.3);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  min-height:150px;
}

.bossList{display:grid;gap:8px;max-height:320px;overflow:auto}
.bossItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
}
.bossItem input{transform:scale(1.15)}
.bossItem span{font-weight:800}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}
</style>
</head>

<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span style="font-size:11px;color:var(--muted)">Saved locally</span>
  </h1>
</header>

<main>

<section>
  <div class="card">
    <div class="row">
      <button onclick="roll(1)">Roll 1</button>
      <button onclick="roll(2)">Roll 2</button>
      <button onclick="roll(3)">Roll 3</button>
      <span class="spacer"></span>
      <button class="secondary" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="divider"></div>

    <div class="result" id="result">
      Click a roll button to generate tasks.
    </div>
  </div>

  <!-- LOG -->
  <div class="card" style="margin-top:14px">
    <div class="row">
      <strong>Log</strong>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--muted)">
        <span id="logCount">0</span> entries
      </span>
    </div>

    <div class="divider"></div>

    <div style="max-height:260px;overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Boss</th>
            <th>Task #</th>
            <th>Points</th>
            <th>Task</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="clearLog()">Clear Log</button>
    </div>
  </div>

  <!-- TASK INPUT -->
  <div class="card" style="margin-top:14px">
    <strong>Tasks</strong>
    <textarea id="taskInput"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="loadTasks()">Load + Save Tasks</button>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <strong>Boss Filters</strong>
    <div class="divider"></div>
    <div class="bossList" id="bossList"></div>
  </div>
</aside>

</main>

<script>
const STORAGE_TASKS="tasks_v1";
const STORAGE_FILTERS="filters_v1";
const STORAGE_LOG="log_v1";

let tasks=[
 {id:1,points:950,boss:"Abyssal Sire",desc:"Create a Bludgeon"},
 {id:2,points:315,boss:"Abyssal Sire",desc:"Obtain 1 Unsired"},
 {id:3,points:4500,boss:"Alchemical Hydra",desc:"Obtain Hydra Claw"}
];

let enabledBosses=new Set();
let log=[];

function saveAll(){
 localStorage.setItem(STORAGE_TASKS,JSON.stringify(tasks));
 localStorage.setItem(STORAGE_FILTERS,JSON.stringify([...enabledBosses]));
 localStorage.setItem(STORAGE_LOG,JSON.stringify(log));
}

function loadAll(){
 tasks=JSON.parse(localStorage.getItem(STORAGE_TASKS))||tasks;
 enabledBosses=new Set(JSON.parse(localStorage.getItem(STORAGE_FILTERS))||tasks.map(t=>t.boss));
 log=JSON.parse(localStorage.getItem(STORAGE_LOG))||[];
 renderBosses();
 renderLog();
 document.getElementById("taskInput").value=exportTasks();
}

function roll(n){
 const eligible=tasks.filter(t=>enabledBosses.has(t.boss));
 if(!eligible.length) return;

 const chosen=[...eligible].sort(()=>0.5-Math.random()).slice(0,n);
 const now=new Date().toISOString();

 chosen.forEach(t=>{
   log.unshift({time:now,...t});
 });

 saveAll();
 renderLog();

 document.getElementById("result").innerHTML=`
  <div class="resultGrid">
   ${chosen.map(t=>`
    <div class="taskCard">
      <div class="taskHead">
        <span class="tag">${t.boss}</span>
        <span class="pointsBadge">${t.points} pts</span>
      </div>
      <div class="desc">${t.desc}</div>
    </div>
   `).join("")}
  </div>`;
}

function renderBosses(){
 const list=document.getElementById("bossList");
 list.innerHTML="";
 [...new Set(tasks.map(t=>t.boss))].forEach(b=>{
  const label=document.createElement("label");
  label.className="bossItem";
  const cb=document.createElement("input");
  cb.type="checkbox";
  cb.checked=enabledBosses.has(b);
  cb.onchange=()=>{cb.checked?enabledBosses.add(b):enabledBosses.delete(b);saveAll();}
  label.append(cb,document.createElement("span"));
  label.lastChild.textContent=b;
  list.appendChild(label);
 });
}

function renderLog(){
 document.getElementById("logCount").textContent=log.length;
 document.getElementById("logBody").innerHTML=log.map(r=>`
  <tr>
   <td>${new Date(r.time).toLocaleString()}</td>
   <td><strong>${r.boss}</strong></td>
   <td>${r.id}</td>
   <td>${r.points}</td>
   <td>${r.desc}</td>
  </tr>`).join("");
}

function clearLog(){
 log=[];
 saveAll();
 renderLog();
}

function parseTasks(text){
 return text.split("\n").map(l=>l.split("\t")).filter(p=>p.length>=4)
 .map(p=>({id:p[0],points:+p[1],boss:p[2],desc:p.slice(3).join(" ")}));
}

function loadTasks(){
 tasks=parseTasks(document.getElementById("taskInput").value);
 enabledBosses=new Set(tasks.map(t=>t.boss));
 saveAll();
 renderBosses();
}

function exportTasks(){
 return tasks.map(t=>`${t.id}\t${t.points}\t${t.boss}\t${t.desc}`).join("\n");
}

function resetFilters(){
 enabledBosses=new Set(tasks.map(t=>t.boss));
 saveAll();
 renderBosses();
}

loadAll();
</script>

</body>
</html>
