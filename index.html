<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Task Roller</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#171a22;
      --text:#eef2ff;
      --muted:#a8b0c7;
      --accent:#ff7a18;
      --accent2:#ffb86b;
      --border:rgba(255,255,255,.10);
      --good:#35d07f;
      --bad:#ff4d4d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0b0d12, var(--bg));
      color:var(--text);
    }
    header{
      padding:20px 18px 10px;
      border-bottom:1px solid var(--border);
      background: rgba(0,0,0,.25);
      position: sticky;
      top:0;
      z-index: 10;
    }
    h1{
      margin:0;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .spacer{flex:1}

    main{
      max-width:1100px;
      margin: 0 auto;
      padding: 18px;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
    }
    @media (max-width: 980px){
      main{grid-template-columns: 1fr}
    }

    .card{
      background: rgba(23,26,34,.85);
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
    }
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

    button{
      cursor:pointer;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(255,122,24,.95), rgba(255,122,24,.75));
      color:#0b0d12;
      font-weight:800;
      padding:10px 14px;
      border-radius:12px;
    }
    button.secondary{
      background: rgba(255,255,255,.06);
      color: var(--text);
    }

    .divider{height:1px; background:var(--border); margin:12px 0}

    .result{
      background: rgba(0,0,0,.28);
      border:1px dashed rgba(255,255,255,.18);
      border-radius:16px;
      padding:14px;
    }

    .resultGrid{
      display:grid;
      gap:10px;
      margin-top:10px;
    }

    .taskCard{
      background: rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      border-radius:14px;
      padding:12px;
    }

    .taskHead{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .tag{
      font-size:12px;
      padding:3px 9px;
      border-radius:999px;
      background: rgba(255,122,24,.18);
      border:1px solid rgba(255,122,24,.25);
      font-weight:800;
    }

    .kv{
      display:grid;
      grid-template-columns: 100px 1fr;
      gap:6px 10px;
      margin-top:10px;
    }
    .k{color:var(--muted); font-size:12px}
    .v{font-weight:800}

    .desc{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid var(--border);
      font-weight:700;
    }

    .bossList{
      display:grid;
      gap:8px;
      max-height: 340px;
      overflow:auto;
    }
    .bossItem{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .bossItem input{transform: scale(1.15)}
    .bossItem span{font-weight:800}

    textarea{
      width:100%;
      background: rgba(0,0,0,.25);
      color: var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
      min-height:150px;
    }
  </style>
</head>
<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span style="font-size:11px;color:#aaa">Saved locally</span>
  </h1>
</header>

<main>
  <section>
    <div class="card">
      <div class="row">
        <button onclick="rollTasks(1)">Roll 1</button>
        <button onclick="rollTasks(2)">Roll 2</button>
        <button onclick="rollTasks(3)">Roll 3</button>
        <div class="spacer"></div>
        <button class="secondary" onclick="resetAll()">Reset</button>
      </div>

      <div class="divider"></div>

      <div class="result" id="result">
        Click a roll button to generate tasks.
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div style="font-weight:900">Tasks</div>
      <textarea id="taskInput"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="secondary" onclick="loadTasks()">Load Tasks</button>
      </div>
    </div>
  </section>

  <aside>
    <div class="card">
      <div style="font-weight:900">Boss Filters</div>
      <div class="bossList" id="bossList"></div>
    </div>
  </aside>
</main>

<script>
let tasks = [
  {id:1,points:950,boss:"Abyssal Sire",desc:"Create a Bludgeon (3 Unsireds completes the task)"},
  {id:2,points:315,boss:"Abyssal Sire",desc:"Obtain 1 Unsired"},
  {id:3,points:2100,boss:"Abyssal Sire",desc:"Obtain an Abyssal Dagger"},
  {id:4,points:75,boss:"Abyssal Sire",desc:"3 unique people complete CA: Perfect Sire"},
  {id:5,points:4500,boss:"Alchemical Hydra",desc:"Obtain a Hydra Claw"},
  {id:6,points:5200,boss:"Alchemical Hydra",desc:"Create a Dragon Hunter Lance"},
  {id:7,points:2400,boss:"Alchemical Hydra",desc:"Create a Brimstone Ring"},
];

let enabledBosses = new Set(tasks.map(t=>t.boss));

function rollTasks(n){
  const eligible = tasks.filter(t=>enabledBosses.has(t.boss));
  if(!eligible.length) return;

  const shuffled = eligible.sort(()=>0.5-Math.random());
  const chosen = shuffled.slice(0, Math.min(n, shuffled.length));

  document.getElementById("result").innerHTML = `
    <div class="resultGrid">
      ${chosen.map((t,i)=>`
        <div class="taskCard">
          <div class="taskHead">
            <strong>Task ${i+1}</strong>
            <span class="tag">${t.boss}</span>
          </div>
          <div class="kv">
            <div class="k">Task #</div><div class="v">${t.id}</div>
            <div class="k">Points</div><div class="v">${t.points}</div>
          </div>
          <div class="desc">${t.desc}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderBosses(){
  const list = document.getElementById("bossList");
  list.innerHTML = "";
  [...new Set(tasks.map(t=>t.boss))].forEach(b=>{
    const div=document.createElement("label");
    div.className="bossItem";
    div.innerHTML=`<input type="checkbox" checked> <span>${b}</span>`;
    div.querySelector("input").onchange=e=>{
      e.target.checked ? enabledBosses.add(b) : enabledBosses.delete(b);
    };
    list.appendChild(div);
  });
}

function loadTasks(){
  alert("Task parsing can be added next — core rolling is complete.");
}

function resetAll(){
  enabledBosses = new Set(tasks.map(t=>t.boss));
  renderBosses();
  document.getElementById("result").innerHTML="Reset complete.";
}

renderBosses();
</script>

</body>
</html>
