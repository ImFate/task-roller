<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background:#ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.taskHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.pointsBadge{
  font-size:18px;
  font-weight:900;
  padding:6px 12px;
  border-radius:999px;
  background:#ffff00;
  color:#111;
  white-space:nowrap;
}

/* FLAT boss pill */
.bossPill{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:6px 14px 6px 10px;
  border-radius:999px;

  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.22);

  box-shadow: 0 6px 16px rgba(0,0,0,.35);

  font-weight:900;
  font-size:13px;
  letter-spacing:.2px;
  line-height:1;
}

.bossPill img{
  width:22px;
  height:22px;
  border-radius:7px;
  object-fit:cover;
  flex:0 0 auto;

  border:1px solid rgba(255,255,255,.25);
  box-shadow: 0 6px 12px rgba(0,0,0,.35);
}

.desc{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-weight:700;
  line-height:1.35;
}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}

/* Boss icon grid */
.bossIconGrid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap:10px;
}

.bossIcon{
  position:relative;
  width:52px;
  height:52px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.05);
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

.bossIcon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: opacity .15s ease, filter .15s ease, transform .08s ease;
}

.bossIcon:hover img{ transform: scale(1.03); }
.bossIcon.off img{ opacity:.28; filter: grayscale(1) brightness(.8); }

.bossIcon .tip{
  position:absolute;
  left:50%;
  bottom:6px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  max-width:92%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}

.smallNote{ font-size:11px;color:var(--muted); }
</style>
</head>

<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span id="status" class="smallNote">Loading tasks…</span>
  </h1>
</header>

<main>

<section>
  <div class="card">
    <div class="row">
      <button onclick="roll(1)">Roll 1</button>
      <button onclick="roll(2)">Roll 2</button>
      <button onclick="roll(3)">Roll 3</button>
      <span class="spacer"></span>
      <button class="secondary" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="divider"></div>

    <div class="result" id="result">
      Click a roll button to generate tasks.
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="row">
      <strong>Log</strong>
      <span class="spacer"></span>
      <span class="smallNote"><span id="logCount">0</span> entries</span>
    </div>

    <div class="divider"></div>

    <div style="max-height:260px;overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Boss</th><th>#</th><th>Pts</th><th>Task</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="clearLog()">Clear Log</button>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <strong>Boss Filters</strong>
    <div class="divider"></div>
    <div class="bossIconGrid" id="bossList"></div>
  </div>
</aside>

</main>

<script>
const STORAGE_FILTERS="filters_v1";
const STORAGE_LOG="log_v1";

let tasks=[], enabledBosses=new Set(), log=[];

function bossToIconPath(b){
  return "icons/"+b.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")+".png";
}

function bossPillHTML(b){
  const src=bossToIconPath(b);
  return `<span class="bossPill"><img src="${src}" onerror="this.style.display='none'"><span>${b}</span></span>`;
}

async function loadTasks(){
  const t=await (await fetch("tasks.csv",{cache:"no-store"})).text();
  tasks=t.split(/\r?\n/).filter(Boolean).map((l,i)=>{const c=l.split(",");return{ id:i+1, points:+c[0], boss:c[1], desc:c.slice(2).join(",") }});
  enabledBosses=new Set(tasks.map(t=>t.boss));
  renderBosses();
  document.getElementById("status").textContent=`Loaded ${tasks.length} tasks`;
}

function roll(n){
  const e=tasks.filter(t=>enabledBosses.has(t.boss));
  const c=[...e].sort(()=>.5-Math.random()).slice(0,n);
  log.unshift(...c.map(t=>({time:new Date(),...t})));
  renderLog();
  document.getElementById("result").innerHTML=`<div class="resultGrid">${c.map(t=>`
    <div class="taskCard">
      <div class="taskHead">${bossPillHTML(t.boss)}<span class="pointsBadge">${t.points} pts</span></div>
      <div class="desc">${t.desc}</div>
    </div>`).join("")}</div>`;
}

function renderBosses(){
  const l=document.getElementById("bossList"); l.innerHTML="";
  [...new Set(tasks.map(t=>t.boss))].forEach(b=>{
    const d=document.createElement("div"); d.className="bossIcon"+(enabledBosses.has(b)?"":" off");
    const i=document.createElement("img"); i.src=bossToIconPath(b);
    d.append(i); d.onclick=()=>{enabledBosses.has(b)?enabledBosses.delete(b):enabledBosses.add(b);d.classList.toggle("off")};
    l.append(d);
  });
}

function renderLog(){
  document.getElementById("logCount").textContent=log.length;
  document.getElementById("logBody").innerHTML=log.map(r=>`<tr><td>${r.time.toLocaleString()}</td><td>${r.boss}</td><td>${r.id}</td><td>${r.points}</td><td>${r.desc}</td></tr>`).join("");
}

function clearLog(){ log=[]; renderLog(); }
function resetFilters(){ enabledBosses=new Set(tasks.map(t=>t.boss)); renderBosses(); }

loadTasks();
</script>

</body>
</html>
