<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background:#ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.taskHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.pointsBadge{
  font-size:18px;
  font-weight:900;
  padding:6px 12px;
  border-radius:999px;
  background:#ffff00;
  color:#111;
  white-space:nowrap;
}

.tag{
  font-size:12px;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,122,24,.2);
  font-weight:800;
}

.desc{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-weight:700;
}

.bossList{display:grid;gap:8px;max-height:320px;overflow:auto}
.bossItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
}
.bossItem input{transform:scale(1.15)}
.bossItem span{font-weight:800}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}
</style>
</head>

<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span id="status" style="font-size:11px;color:var(--muted)">Loading tasks…</span>
  </h1>
</header>

<main>

<section>
  <div class="card">
    <div class="row">
      <button onclick="roll(1)">Roll 1</button>
      <button onclick="roll(2)">Roll 2</button>
      <button onclick="roll(3)">Roll 3</button>
      <span class="spacer"></span>
      <button class="secondary" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="divider"></div>

    <div class="result" id="result">
      Click a roll button to generate tasks.
    </div>
  </div>

  <!-- LOG -->
  <div class="card" style="margin-top:14px">
    <div class="row">
      <strong>Log</strong>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--muted)">
        <span id="logCount">0</span> entries
      </span>
    </div>

    <div class="divider"></div>

    <div style="max-height:260px;overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Boss</th>
            <th>Task #</th>
            <th>Points</th>
            <th>Task</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="clearLog()">Clear Log</button>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <strong>Boss Filters</strong>
    <div class="divider"></div>
    <div class="bossList" id="bossList"></div>
  </div>
</aside>

</main>

<script>
const STORAGE_TASKS="tasks_v1";
const STORAGE_FILTERS="filters_v1";
const STORAGE_LOG="log_v1";

let tasks=[];
let enabledBosses=new Set();
let log=[];

function setStatus(msg){ document.getElementById("status").textContent = msg; }

// ---- CSV helpers ----
function parseCSVRow(line){
  const out = [];
  let cur = "";
  let inQuotes = false;

  for (let i=0; i<line.length; i++){
    const ch = line[i];

    if (ch === '"'){
      if (inQuotes && line[i+1] === '"'){
        cur += '"'; i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === ',' && !inQuotes){
      out.push(cur.trim());
      cur = "";
    } else {
      cur += ch;
    }
  }
  out.push(cur.trim());
  return out;
}

function looksLikeHeader(cols){
  const joined = cols.join(" ").toLowerCase();
  return joined.includes("points") || joined.includes("boss") || joined.includes("task");
}

// ---- storage ----
function saveAll(){
  localStorage.setItem(STORAGE_TASKS,JSON.stringify(tasks));
  localStorage.setItem(STORAGE_FILTERS,JSON.stringify([...enabledBosses]));
  localStorage.setItem(STORAGE_LOG,JSON.stringify(log));
}

function loadSaved(){
  const savedLog = localStorage.getItem(STORAGE_LOG);
  log = savedLog ? (JSON.parse(savedLog) || []) : [];
  renderLog();
}

// ---- load tasks from CSV (supports 3-col or 4-col) ----
async function loadTasksFromCSV(){
  const res = await fetch("tasks.csv", { cache: "no-store" });
  if (!res.ok) throw new Error("Could not fetch tasks.csv");
  const text = await res.text();

  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) throw new Error("tasks.csv is empty");

  // detect header
  const firstCols = parseCSVRow(lines[0]);
  const start = looksLikeHeader(firstCols) ? 1 : 0;

  const parsed = [];
  let autoId = 1;

  for (let i=start; i<lines.length; i++){
    const cols = parseCSVRow(lines[i]);
    if (cols.length < 3) continue;

    // 3 columns: points, boss, desc
    if (cols.length === 3){
      parsed.push({
        id: autoId++,
        points: Number(cols[0]) || 0,
        boss: cols[1],
        desc: cols[2]
      });
      continue;
    }

    // 4+ columns:
    // If your file is id,points,boss,desc -> use it.
    // If your file is points,boss,desc,extra... -> treat first as points if numeric.
    const firstIsNumber = !isNaN(Number(cols[0])) && cols[0] !== "";

    if (firstIsNumber && cols.length >= 4){
      // Decide whether cols[0] is id or points:
      // If cols[1] is numeric too, cols[0] is probably id.
      const secondIsNumber = !isNaN(Number(cols[1])) && cols[1] !== "";

      if (secondIsNumber){
        // id, points, boss, desc...
        parsed.push({
          id: cols[0],
          points: Number(cols[1]) || 0,
          boss: cols[2],
          desc: cols.slice(3).join(",").trim()
        });
      } else {
        // points, boss, desc...
        parsed.push({
          id: autoId++,
          points: Number(cols[0]) || 0,
          boss: cols[1],
          desc: cols.slice(2).join(",").trim()
        });
      }
    }
  }

  if (!parsed.length) throw new Error("No tasks parsed from tasks.csv");

  tasks = parsed;
  enabledBosses = new Set([...new Set(tasks.map(t => t.boss))]);
  saveAll();
  renderBosses();
  setStatus(`Loaded ${tasks.length} tasks`);
}

// ---- UI ----
function roll(n){
  if (!tasks.length){
    document.getElementById("result").textContent = "Tasks not loaded yet (or tasks.csv failed).";
    return;
  }

  const eligible = tasks.filter(t => enabledBosses.has(t.boss));
  if (!eligible.length){
    document.getElementById("result").textContent = "No eligible tasks. Enable at least one boss.";
    return;
  }

  const chosen = [...eligible].sort(()=>0.5-Math.random()).slice(0, Math.min(n, eligible.length));
  const now = new Date().toISOString();

  chosen.forEach(t => log.unshift({ time: now, ...t }));
  saveAll();
  renderLog();

  document.getElementById("result").innerHTML = `
    <div class="resultGrid">
      ${chosen.map(t => `
        <div class="taskCard">
          <div class="taskHead">
            <span class="tag">${t.boss}</span>
            <span class="pointsBadge">${t.points} pts</span>
          </div>
          <div class="desc">${t.desc}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderBosses(){
  const list = document.getElementById("bossList");
  list.innerHTML = "";

  const bosses = [...new Set(tasks.map(t=>t.boss))];
  bosses.forEach(b=>{
    const label=document.createElement("label");
    label.className="bossItem";
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=enabledBosses.has(b);
    cb.onchange=()=>{ cb.checked ? enabledBosses.add(b) : enabledBosses.delete(b); saveAll(); };
    const sp=document.createElement("span");
    sp.textContent=b;
    label.append(cb,sp);
    list.appendChild(label);
  });
}

function renderLog(){
  document.getElementById("logCount").textContent = log.length;
  document.getElementById("logBody").innerHTML = log.map(r=>`
    <tr>
      <td>${new Date(r.time).toLocaleString()}</td>
      <td><strong>${r.boss}</strong></td>
      <td>${r.id}</td>
      <td>${r.points}</td>
      <td>${r.desc}</td>
    </tr>
  `).join("");
}

function clearLog(){
  log=[];
  saveAll();
  renderLog();
}

function resetFilters(){
  enabledBosses = new Set(tasks.map(t=>t.boss));
  saveAll();
  renderBosses();
}

// ---- boot ----
(async()=>{
  loadSaved();
  try{
    await loadTasksFromCSV();
  } catch (e){
    console.error(e);
    setStatus("tasks.csv failed to load");
    document.getElementById("result").textContent =
      "Could not load tasks.csv. Make sure tasks.csv is in the same folder and GitHub Pages is enabled.";
  }
})();
</script>

</body>
</html>
