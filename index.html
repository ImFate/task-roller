<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<!-- Perk Wars favicon -->
<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --accent:#ff7a18;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background: #ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:12px;
}

.taskHead{display:flex;gap:10px;align-items:center}
.tag{
  font-size:12px;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,122,24,.2);
  font-weight:800;
}

.kv{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:6px 10px;
  margin-top:10px;
}
.k{color:var(--muted);font-size:12px}
.v{font-weight:800}

.desc{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border);
  font-weight:700;
}

textarea{
  width:100%;
  background:rgba(0,0,0,.3);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  min-height:150px;
}

.bossList{display:grid;gap:8px;max-height:320px;overflow:auto}
.bossItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
}
.bossItem input{transform:scale(1.15)}
.bossItem span{font-weight:800}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}
</style>
</head>

<body>
<!-- body content unchanged -->
</body>
</html>
