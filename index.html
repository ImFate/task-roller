<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background:#ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.taskHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pointsBadge{
  font-size:18px;
  font-weight:900;
  padding:6px 12px;
  border-radius:999px;
  background:#ffff00;
  color:#111;
}

.tag{
  font-size:12px;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,122,24,.2);
  font-weight:800;
}

.desc{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-weight:700;
}

.bossList{display:grid;gap:8px;max-height:320px;overflow:auto}
.bossItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
}
.bossItem input{transform:scale(1.15)}
.bossItem span{font-weight:800}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}
</style>
</head>

<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span style="font-size:11px;color:var(--muted)">Tasks auto-loaded</span>
  </h1>
</header>

<main>

<section>
  <div class="card">
    <div class="row">
      <button onclick="roll(1)">Roll 1</button>
      <button onclick="roll(2)">Roll 2</button>
      <button onclick="roll(3)">Roll 3</button>
      <span class="spacer"></span>
      <button class="secondary" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="divider"></div>

    <div class="result" id="result">
      Click a roll button to generate tasks.
    </div>
  </div>

  <!-- LOG -->
  <div class="card" style="margin-top:14px">
    <div class="row">
      <strong>Log</strong>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--muted)">
        <span id="logCount">0</span> entries
      </span>
    </div>

    <div class="divider"></div>

    <div style="max-height:260px;overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Boss</th>
            <th>Task #</th>
            <th>Points</th>
            <th>Task</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="clearLog()">Clear Log</button>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <strong>Boss Filters</strong>
    <div class="divider"></div>
    <div class="bossList" id="bossList"></div>
  </div>
</aside>

</main>

<script>
const STORAGE_TASKS="tasks_v1";
const STORAGE_FILTERS="filters_v1";
const STORAGE_LOG="log_v1";

let tasks=[];
let enabledBosses=new Set();
let log=[];

// ---- CSV AUTO LOAD ----
async function loadTasksFromCSV(){
  const res = await fetch("tasks.csv", { cache: "no-store" });
  const text = await res.text();
  const lines = text.split(/\r?\n/).filter(Boolean);

  const start = lines[0].toLowerCase().includes("points") ? 1 : 0;
  tasks = [];

  for (let i=start;i<lines.length;i++){
    const cols = parseCSV(lines[i]);
    if (cols.length < 4) continue;
    tasks.push({
      id: cols[0],
      points: Number(cols[1]) || 0,
      boss: cols[2],
      desc: cols.slice(3).join(",")
    });
  }

  enabledBosses = new Set(tasks.map(t=>t.boss));
  saveAll();
  renderBosses();
}

function parseCSV(line){
  const out=[],cur=[];
  let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c=='"' && line[i+1]=='"'){cur.push('"');i++;}
    else if(c=='"') q=!q;
    else if(c==',' && !q){out.push(cur.join("").trim());cur.length=0;}
    else cur.push(c);
  }
  out.push(cur.join("").trim());
  return out;
}

// ---- CORE ----
function saveAll(){
 localStorage.setItem(STORAGE_TASKS,JSON.stringify(tasks));
 localStorage.setItem(STORAGE_FILTERS,JSON.stringify([...enabledBosses]));
 localStorage.setItem(STORAGE_LOG,JSON.stringify(log));
}

function roll(n){
 const eligible=tasks.filter(t=>enabledBosses.has(t.boss));
 if(!eligible.length) return;

 const chosen=[...eligible].sort(()=>0.5-Math.random()).slice(0,n);
 const now=new Date().toISOString();

 chosen.forEach(t=>log.unshift({time:now,...t}));
 saveAll();
 renderLog();

 document.getElementById("result").innerHTML=`
  <div class="resultGrid">
   ${chosen.map(t=>`
    <div class="taskCard">
      <div class="taskHead">
        <span class="tag">${t.boss}</span>
        <span class="pointsBadge">${t.points} pts</span>
      </div>
      <div class="desc">${t.desc}</div>
    </div>`).join("")}
  </div>`;
}

function renderBosses(){
 const list=document.getElementById("bossList");
 list.innerHTML="";
 [...new Set(tasks.map(t=>t.boss))].forEach(b=>{
  const l=document.createElement("label");
  l.className="bossItem";
  const cb=document.createElement("input");
  cb.type="checkbox";
  cb.checked=enabledBosses.has(b);
  cb.onchange=()=>{cb.checked?enabledBosses.add(b):enabledBosses.delete(b);saveAll();}
  l.append(cb,document.createElement("span"));
  l.lastChild.textContent=b;
  list.appendChild(l);
 });
}

function renderLog(){
 document.getElementById("logCount").textContent=log.length;
 document.getElementById("logBody").innerHTML=log.map(r=>`
  <tr>
   <td>${new Date(r.time).toLocaleString()}</td>
   <td><strong>${r.boss}</strong></td>
   <td>${r.id}</td>
   <td>${r.points}</td>
   <td>${r.desc}</td>
  </tr>`).join("");
}

function clearLog(){
 log=[];
 saveAll();
 renderLog();
}

function resetFilters(){
 enabledBosses=new Set(tasks.map(t=>t.boss));
 saveAll();
 renderBosses();
}

// ---- BOOT ----
(async()=>{
 log=JSON.parse(localStorage.getItem(STORAGE_LOG))||[];
 await loadTasksFromCSV();
 renderLog();
})();
</script>

</body>
</html>
