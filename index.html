<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Roller</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
:root{
  --bg:#0f1115;
  --panel:#171a22;
  --text:#eef2ff;
  --muted:#a8b0c7;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(180deg,#0b0d12,var(--bg));
  color:var(--text);
}

header{
  padding:20px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,.3);
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  margin:0;
  font-size:18px;
  display:flex;
  align-items:center;
}
.spacer{flex:1}

main{
  max-width:1100px;
  margin:0 auto;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:14px;
}
@media(max-width:980px){ main{grid-template-columns:1fr} }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

button{
  cursor:pointer;
  border:1px solid rgba(255,255,255,.15);
  background:#ffff00;
  color:#111;
  font-weight:800;
  padding:10px 14px;
  border-radius:12px;
}
button.secondary{
  background:rgba(255,255,255,.06);
  color:var(--text);
}

.divider{height:1px;background:var(--border);margin:12px 0}

.result{
  background:rgba(0,0,0,.35);
  border:1px dashed rgba(255,255,255,.18);
  border-radius:16px;
  padding:14px;
}

.resultGrid{display:grid;gap:10px;margin-top:10px}

.taskCard{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px;
}

.taskHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.pointsBadge{
  font-size:18px;
  font-weight:900;
  padding:6px 12px;
  border-radius:999px;
  background:#ffff00;
  color:#111;
  white-space:nowrap;
}

/* Boss pill (roll output) */
.bossPill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:4px 10px 4px 6px;
  border-radius:999px;
  background:rgba(255,122,24,.2);
  font-weight:900;
  font-size:12px;
  line-height:1;
  max-width: 70%;
}

.bossPill img{
  width:18px;
  height:18px;
  border-radius:5px;
  object-fit:cover;
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.12);
}

.desc{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-weight:700;
  line-height:1.35;
}

/* LOG */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--muted);text-align:left;background:rgba(0,0,0,.35);position:sticky;top:0}
tbody tr:hover{background:rgba(255,255,255,.04)}

/* Boss icon grid */
.bossIconGrid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap:10px;
}

.bossIcon{
  position:relative;
  width:52px;
  height:52px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.05);
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

.bossIcon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: opacity .15s ease, filter .15s ease, transform .08s ease;
}

.bossIcon:hover img{
  transform: scale(1.03);
}

.bossIcon.off img{
  opacity:0.28;
  filter: grayscale(1) brightness(0.8);
}

.bossIcon .tip{
  position:absolute;
  left:50%;
  bottom:6px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.9);
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  max-width:92%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}

.smallNote{
  font-size:11px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>
    Task Roller
    <span class="spacer"></span>
    <span id="status" class="smallNote">Loading tasks…</span>
  </h1>
</header>

<main>

<section>
  <div class="card">
    <div class="row">
      <button onclick="roll(1)">Roll 1</button>
      <button onclick="roll(2)">Roll 2</button>
      <button onclick="roll(3)">Roll 3</button>
      <span class="spacer"></span>
      <button class="secondary" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="divider"></div>

    <div class="result" id="result">
      Click a roll button to generate tasks.
    </div>
  </div>

  <!-- LOG -->
  <div class="card" style="margin-top:14px">
    <div class="row">
      <strong>Log</strong>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--muted)">
        <span id="logCount">0</span> entries
      </span>
    </div>

    <div class="divider"></div>

    <div style="max-height:260px;overflow:auto;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Boss</th>
            <th>Task #</th>
            <th>Points</th>
            <th>Task</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="secondary" onclick="clearLog()">Clear Log</button>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <div class="row" style="align-items:baseline">
      <strong>Boss Filters</strong>
      <span class="spacer"></span>
      <span class="smallNote">Click icons to toggle</span>
    </div>
    <div class="divider"></div>
    <div class="bossIconGrid" id="bossList"></div>
    <div class="divider"></div>
    <div class="row">
      <button class="secondary" onclick="enableAllBosses()">Enable All</button>
      <button class="secondary" onclick="disableAllBosses()">Disable All</button>
    </div>
  </div>
</aside>

</main>

<script>
const STORAGE_FILTERS="filters_v1";
const STORAGE_LOG="log_v1";

let tasks = [];
let enabledBosses = new Set();
let log = [];

function setStatus(msg){
  const el = document.getElementById("status");
  if (el) el.textContent = msg;
}

/* ---------- CSV parsing ---------- */
function parseCSVRow(line){
  const out = [];
  let cur = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i++){
    const ch = line[i];

    if (ch === '"'){
      if (inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes){
      out.push(cur.trim());
      cur = "";
    } else {
      cur += ch;
    }
  }
  out.push(cur.trim());
  return out;
}

function looksLikeHeader(cols){
  const joined = cols.join(" ").toLowerCase();
  return joined.includes("points") || joined.includes("boss") || joined.includes("task");
}

async function loadTasksFromCSV(){
  const res = await fetch("tasks.csv", { cache: "no-store" });
  if (!res.ok) throw new Error("Could not fetch tasks.csv");
  const text = await res.text();

  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) throw new Error("tasks.csv is empty");

  const firstCols = parseCSVRow(lines[0]);
  const start = looksLikeHeader(firstCols) ? 1 : 0;

  const parsed = [];
  let autoId = 1;

  for (let i = start; i < lines.length; i++){
    const cols = parseCSVRow(lines[i]);
    if (cols.length < 3) continue;

    // 3 columns: points, boss, desc
    if (cols.length === 3){
      parsed.push({
        id: autoId++,
        points: Number(cols[0]) || 0,
        boss: cols[1],
        desc: cols[2]
      });
      continue;
    }

    // 4+ columns:
    const firstIsNumber = cols[0] !== "" && !isNaN(Number(cols[0]));
    const secondIsNumber = cols[1] !== "" && !isNaN(Number(cols[1]));

    if (firstIsNumber && secondIsNumber){
      // id, points, boss, desc...
      parsed.push({
        id: cols[0],
        points: Number(cols[1]) || 0,
        boss: cols[2],
        desc: cols.slice(3).join(",").trim()
      });
    } else if (firstIsNumber){
      // points, boss, desc...
      parsed.push({
        id: autoId++,
        points: Number(cols[0]) || 0,
        boss: cols[1],
        desc: cols.slice(2).join(",").trim()
      });
    }
  }

  if (!parsed.length) throw new Error("No tasks parsed from tasks.csv");
  tasks = parsed;

  // Bosses enabled by default
  enabledBosses = new Set([...new Set(tasks.map(t => t.boss))]);

  // Try to load saved filters (optional)
  const savedFilters = localStorage.getItem(STORAGE_FILTERS);
  if (savedFilters){
    try{
      const arr = JSON.parse(savedFilters);
      if (Array.isArray(arr)) enabledBosses = new Set(arr);
    } catch {}
  }

  renderBosses();
  setStatus(`Loaded ${tasks.length} tasks`);
}

/* ---------- storage ---------- */
function saveFilters(){
  localStorage.setItem(STORAGE_FILTERS, JSON.stringify([...enabledBosses]));
}
function saveLog(){
  localStorage.setItem(STORAGE_LOG, JSON.stringify(log));
}
function loadSavedLog(){
  const savedLog = localStorage.getItem(STORAGE_LOG);
  try { log = savedLog ? (JSON.parse(savedLog) || []) : []; }
  catch { log = []; }
  renderLog();
}

/* ---------- Boss icon mapping ---------- */
function bossToIconPath(bossName){
  const file = bossName
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
  return `icons/${file}.png`;
}

// Makes an HTML string for the boss pill with icon.
// Uses <img onerror> to hide itself if missing.
function bossPillHTML(boss){
  const src = bossToIconPath(boss);
  return `
    <span class="bossPill" title="${escapeHtml(boss)}">
      <img src="${escapeHtml(src)}" alt="" onerror="this.style.display='none'">
      <span>${escapeHtml(boss)}</span>
    </span>
  `;
}

function renderBosses(){
  const list = document.getElementById("bossList");
  list.innerHTML = "";

  const bosses = [...new Set(tasks.map(t => t.boss))].sort((a,b)=>a.localeCompare(b));

  bosses.forEach(boss => {
    const wrap = document.createElement("div");
    wrap.className = "bossIcon" + (enabledBosses.has(boss) ? "" : " off");
    wrap.title = boss;

    const img = document.createElement("img");
    img.src = bossToIconPath(boss);
    img.alt = boss;

    img.onerror = () => {
      img.remove();
      const fallback = document.createElement("div");
      fallback.style.width="100%";
      fallback.style.height="100%";
      fallback.style.display="flex";
      fallback.style.alignItems="center";
      fallback.style.justifyContent="center";
      fallback.style.fontWeight="900";
      fallback.style.color="rgba(255,255,255,.85)";
      fallback.style.fontSize="18px";
      fallback.textContent = boss.trim().charAt(0).toUpperCase();
      wrap.appendChild(fallback);
      if (!enabledBosses.has(boss)) wrap.style.opacity = "0.35";
    };

    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = boss;

    wrap.appendChild(img);
    wrap.appendChild(tip);

    wrap.onclick = () => {
      if (enabledBosses.has(boss)) enabledBosses.delete(boss);
      else enabledBosses.add(boss);

      saveFilters();
      wrap.classList.toggle("off");
    };

    list.appendChild(wrap);
  });
}

function enableAllBosses(){
  enabledBosses = new Set(tasks.map(t => t.boss));
  saveFilters();
  renderBosses();
}

function disableAllBosses(){
  enabledBosses = new Set();
  saveFilters();
  renderBosses();
}

/* ---------- rolling ---------- */
function roll(n){
  if (!tasks.length){
    document.getElementById("result").textContent = "Tasks not loaded yet (or tasks.csv failed).";
    return;
  }

  const eligible = tasks.filter(t => enabledBosses.has(t.boss));
  if (!eligible.length){
    document.getElementById("result").textContent = "No eligible tasks. Enable at least one boss.";
    return;
  }

  const chosen = [...eligible].sort(() => 0.5 - Math.random()).slice(0, Math.min(n, eligible.length));
  const now = new Date().toISOString();

  chosen.forEach(t => log.unshift({ time: now, ...t }));
  saveLog();
  renderLog();

  document.getElementById("result").innerHTML = `
    <div class="resultGrid">
      ${chosen.map(t => `
        <div class="taskCard">
          <div class="taskHead">
            ${bossPillHTML(t.boss)}
            <span class="pointsBadge">${escapeHtml(String(t.points))} pts</span>
          </div>
          <div class="desc">${escapeHtml(t.desc)}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, (m) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

/* ---------- log ---------- */
function renderLog(){
  document.getElementById("logCount").textContent = log.length;
  document.getElementById("logBody").innerHTML = log.map(r => `
    <tr>
      <td>${new Date(r.time).toLocaleString()}</td>
      <td><strong>${escapeHtml(r.boss)}</strong></td>
      <td>${escapeHtml(String(r.id))}</td>
      <td>${escapeHtml(String(r.points))}</td>
      <td>${escapeHtml(r.desc)}</td>
    </tr>
  `).join("");
}

function clearLog(){
  log = [];
  saveLog();
  renderLog();
}

/* ---------- reset filters ---------- */
function resetFilters(){
  enabledBosses = new Set(tasks.map(t => t.boss));
  saveFilters();
  renderBosses();
}

/* ---------- boot ---------- */
(async () => {
  loadSavedLog();

  try{
    await loadTasksFromCSV();
  } catch (e){
    console.error(e);
    setStatus("tasks.csv failed to load");
    document.getElementById("result").textContent =
      "Could not load tasks.csv. Make sure tasks.csv is in the same folder and GitHub Pages is serving it.";
  }
})();
</script>

</body>
</html>
